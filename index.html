<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZONABET</title>
    <meta name="description" content="Plataforma oficial de apostas desportivas ZONABET para futebol moçambicano (Moçambola, Provinciais e Distritais) em MZN, com boletim de apostas inteligente, liquidação atómica e gestão administrativa." />
    <meta property="og:title" content="ZONABET" />
    <meta property="og:description" content="Plataforma oficial de apostas desportivas ZONABET para futebol moçambicano (Moçambola, Provinciais e Distritais) em MZN, com boletim de apostas inteligente, liquidação atómica e gestão administrativa." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ZONABET" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
  </head>
  <body class="bg-slate-950 text-slate-100 min-h-screen antialiased selection:bg-emerald-500 selection:text-slate-950" style="margin: 0; background-color: #020617; color: #f8fafc;">
    <div id="root">
      <!-- Fallback imediato enquanto o React hidrata (evita tela branca) -->
      <div id="initial-loading-shell" style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #020617; color: #f8fafc; font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; padding: 20px; box-sizing: border-box;">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center;">
          <div style="width: 68px; height: 68px; border-radius: 20px; overflow: hidden; box-shadow: 0 12px 30px -6px rgba(16, 185, 129, 0.45); border: 1px solid rgba(16, 185, 129, 0.3);">
            <img src="/logo.png" alt="ZONABET Logo" style="width: 100%; height: 100%; object-fit: cover;" />
          </div>
          <div>
            <h1 style="font-size: 22px; font-weight: 900; letter-spacing: 0.04em; margin: 0; color: #ffffff;">ZONABET</h1>
            <p style="font-size: 12px; color: #94a3b8; margin: 6px 0 0 0; font-weight: 500;">Futebol Moçambicano & Apostas Desportivas</p>
          </div>
          <div style="margin-top: 8px; width: 28px; height: 28px; border: 3px solid rgba(16, 185, 129, 0.15); border-top-color: #10b981; border-radius: 50%; animation: zonabet-spin 0.75s linear infinite;"></div>
        </div>
      </div>
      <style>
        @keyframes zonabet-spin {
          to { transform: rotate(360deg); }
        }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
