version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: zonabet-backend
    restart: always
    environment:
      PORT: 3000
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:-zonabet_jwt_secret_change_in_production}
      MINIMUM_STAKE: "10"
      MAXIMUM_STAKE: "50000"
      MAXIMUM_POTENTIAL_WIN: "1000000"
    ports:
      - "3000:3000"
